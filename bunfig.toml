[install]
# Explicitly set the linker to isolated
linker = "isolated"

[fmt]
sortImports = true
# Generated by Release Please
ignorePatterns = ["**/CHANGELOG.md"]

# Embedded code formatting collapses code fences nested in JSX, which breaks the MDX build
[[fmt.overrides]]
files = ["*.md", "*.mdx"]
options = { printWidth = 100, proseWrap = "preserve", embeddedLanguageFormatting = "off" }
